name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: "Artifact name for the uploaded Debug APK"
        required: false
        default: "lumina-notebook-debug-apk"
        type: string
      run_unit_tests:
        description: "Run unit tests before assembling Debug APK"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Prepare environment and debug keystore
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair \
                -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run Unit Tests (Optional)
        if: ${{ inputs.run_unit_tests == true }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK & Write Build Summary
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Debug APK was not found at $APK_PATH"
            exit 1
          fi

          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          APK_SHA256=$(sha256sum "$APK_PATH" | cut -d ' ' -f1)

          {
            echo "### Debug APK Build Succeeded"
            echo ""
            echo "| Property | Value |"
            echo "| :--- | :--- |"
            echo "| **Variant** | \`debug\` |"
            echo "| **File Path** | \`$APK_PATH\` |"
            echo "| **Size** | \`$APK_SIZE\` |"
            echo "| **SHA-256** | \`$APK_SHA256\` |"
            echo "| **Artifact Name** | \`${{ inputs.artifact_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
